<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bikin</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }


        .navbar {
            background-color: lightblue;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: bold;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .navbar ul li {
        color:black;
            cursor: pointer;
        }
        .hero {
            background-image: url('https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg');
            background-size: cover;
            height: 600px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
            padding: 20px;
        }

        .hero h1 {
            font-size: 35px;
            margin: 10px 0;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .btn1 {
            background-color: blue;
            color: white;
        }

        .btn2{
            background-color: white;
            color: blue;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div style="color:black">Bikin</div>
        <ul>
            <li>Home</li>
            <li>Feature</li>
            <li>Gallery</li>
            <li>Price & Plan</li>
            <li>Our Team</li>
            <li>Contact</li>
        </ul>
    </div>
    <div class="hero">
        <h1>Clean & Fully Modern Design</h1>
        <p>Welcome To The Website</p>
        <div>
            <button class="btn1">Live Demo</button>
            <button class="btn2">Get Now</button>
        </div>
    </div>
</body>
</html>
